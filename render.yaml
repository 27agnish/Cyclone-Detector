services:
  - type: web
    name: cycloneshield-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://cyclone-detector.vercel.app,http://localhost:5173"
