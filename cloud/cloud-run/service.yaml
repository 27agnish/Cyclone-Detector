apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cycloneshield-ai-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/cycloneshield-ai-project/backend:latest
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: DEMO_MODE
          value: "true"
        - name: CYCLONE_REFRESH_INTERVAL_MINUTES
          value: "15"
        - name: GOOGLE_CLOUD_LOCATION
          value: "asia-south1"
        - name: GEMINI_MODEL
          value: "gemini-2.5-flash"
